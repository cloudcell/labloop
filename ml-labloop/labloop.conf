# labloop.conf — lab VM sizing. Sourced by create-lab-template
# (bash KEY=value lines only). Edit here, or export the same names in
# the environment to override without touching the file.
#
# LABLOOP_VCPUS      guest vCPU count (default 16). At build time the
#                    value is clamped to 75% of the host's CPU cores —
#                    min(LABLOOP_VCPUS, host_cores*3/4) — so a lab VM
#                    can never be sized to starve the host it runs on.
# LABLOOP_MEMORY_MIB guest RAM in MiB (default 16384).
#
# The hostile-zone ceiling is derived, not fixed: lab-cnt-exp gets
# ~5/8 of the guest's vCPUs and ~3/4 of its RAM — the driver zone and
# desktop keep headroom even under a hostile CPU/memory storm.
LABLOOP_VCPUS=16
LABLOOP_MEMORY_MIB=16384
