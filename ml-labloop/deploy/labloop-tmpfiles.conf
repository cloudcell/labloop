# labloop-export staging tree (see plan-20260923-2038Z--secure-data-extraction).
# Lives on real disk (/var/lib) — /run tmpfs is RAM-bounded and lab data
# (workspace, volumes) can exceed it. These dirs must exist from boot so
# BOTH export modes work: path-mode (lab) can only write into user/ if
# it already exists with lab ownership; root likewise cannot let lab
# create root/. 0711 on the base = traverse-only for non-owners; the
# mode dirs are 0700 so the hostile zone can never read or pre-seed
# staging.
d /var/lib/labloop-export       0711 root root -
d /var/lib/labloop-export/user  0700 lab  lab  -
d /var/lib/labloop-export/root  0700 root root -
