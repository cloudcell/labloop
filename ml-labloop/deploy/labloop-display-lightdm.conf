# labloop-display — apply the configured mode at the LOGIN SCREEN too.
# display-setup-script runs as root just after the X server starts,
# before the greeter appears — DISPLAY/XAUTHORITY are set by lightdm.
# Without this the greeter renders at whatever mode X auto-picked and
# the configured resolution only takes effect after login.
[Seat:*]
display-setup-script=/usr/local/libexec/labloop-display.sh
