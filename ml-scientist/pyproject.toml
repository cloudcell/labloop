[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-episteme-mcp"
version = "0.1.0"
description = "Scientific Experiment MCP server — the hypothesis → experiment → evidence → conclusion loop as a first-class object"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ml-scientist team" }]
keywords = ["mcp", "machine-learning", "experimentation", "scientific-method", "hypothesis-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0.1",
    "pydantic>=2.0",
]

[project.urls]
Documentation = "https://github.com/ml-scientist/ml-episteme-mcp/docs"
Source = "https://github.com/ml-scientist/ml-episteme-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ml-episteme-mcp = "ml_episteme_mcp.__main__:main"
ml-anamnesis-mcp = "ml_anamnesis_mcp.__main__:main"
ml-zetesis-mcp = "ml_zetesis_mcp.__main__:main"
ml-arete-mcp = "ml_arete_mcp.__main__:main"
ml-agora-mcp = "ml_agora_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ml_episteme_mcp",
    "src/ml_anamnesis_mcp",
    "src/ml_zetesis_mcp",
    "src/ml_arete_mcp",
    "src/ml_agora_mcp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
# Parallel by default (pytest-xdist). loadfile groups each test file on
# one worker — session/module-scoped server fixtures stay intact and
# files with port-bound subprocesses keep their sequential semantics.
# Serial fallback: `uv run pytest -n0`.
addopts = "-n auto --dist loadfile"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-xdist>=3.5",
]
